<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Astral · Build Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f3efe6;--paper2:#ece6d8;--ink:#1d2a2a;--ink2:#3c4a47;--line:#cfc6b4;
    --ochre:#bf6b2c;--ochre2:#e0a35a;--blue:#2f6f7e;--good:#3f7d54;--warn:#b4472d;--card:#fbf9f3;
    --mono:"IBM Plex Mono",ui-monospace,monospace;--ui:"Archivo",system-ui,sans-serif;--disp:"Fraunces",Georgia,serif;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(var(--line) 0.5px,transparent 0.5px);background-size:22px 22px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);background:rgba(243,239,230,.86);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .mark{font-family:var(--disp);font-weight:700;font-size:22px}
  .brand .mark em{color:var(--ochre);font-style:normal}
  .brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
  .topnote{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.06em;text-align:right;max-width:300px;line-height:1.5}
  .wrap{display:grid;grid-template-columns:1fr 452px;gap:26px;max-width:1240px;margin:24px auto;padding:0 22px}
  @media(max-width:920px){.wrap{grid-template-columns:1fr;gap:18px}}
  .stage{position:sticky;top:78px;align-self:start}
  @media(max-width:920px){.stage{position:static}}
  .canvas{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -34px rgba(29,42,42,.55);overflow:hidden}
  .canvas .bar{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px 14px;border-bottom:1px solid var(--line)}
  .tabs{display:flex;flex-direction:column;gap:7px}
  .ctrlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctrllab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);min-width:34px}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap}
  .tab{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:var(--paper);cursor:pointer}
  .tab.sm{font-size:9.5px;padding:4px 9px}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab.unit{margin-left:auto;border-style:dashed;color:var(--ink2)}
  .canvas .bar span.sc{font-family:var(--mono);font-size:10px;color:var(--ink2);align-self:flex-end}
  svg{display:block;width:100%;height:auto;background:linear-gradient(rgba(47,111,126,.05) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(47,111,126,.05) 1px,transparent 1px) 0 0/24px 24px}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
  .stat{font-family:var(--mono);font-size:11px;color:var(--ink2)} .stat b{color:var(--ink)}
  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--paper2)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -38px rgba(29,42,42,.5)}
  .rail{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 4px}
  .rail .sct{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:18px;background:var(--paper);cursor:pointer;color:var(--ink2)}
  .rail .sct.on{background:var(--ochre);color:#fff;border-color:var(--ochre)}
  .rail .sctgap{flex-basis:100%;height:0}
  .step-head{padding:14px 20px 4px}
  .step-head .kx{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}
  .step-head h2{font-family:var(--disp);font-weight:600;font-size:25px;margin:4px 0 2px;line-height:1.05}
  .step-head p{margin:0;color:var(--ink2);font-size:13px}
  .body{padding:10px 20px 6px;min-height:240px}
  .q{margin:14px 0} .q>label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:7px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-size:13px;font-weight:500;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--ochre2)} .opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .num{display:flex;align-items:center;gap:10px}
  .num input[type=number]{width:104px;font-family:var(--mono);font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
  .num input:focus{outline:none;border-color:var(--ochre)}
  input[type=range]{width:100%;accent-color:var(--ochre)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .sw{display:flex;flex-wrap:wrap;gap:9px}
  .swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);cursor:pointer;position:relative}
  .swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
  .swatch span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;color:var(--ink2);white-space:nowrap}
  .swwrap{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
  .openrow{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;background:var(--paper)}
  .openrow .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .openrow .kind{display:flex;gap:6px}
  .mini{font-size:11px;font-weight:600;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
  .mini.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .rm{font-family:var(--mono);font-size:11px;color:var(--warn);cursor:pointer;border:none;background:none}
  .addbtn{font-family:var(--ui);font-weight:600;font-size:13px;padding:9px 14px;border:1px dashed var(--ochre);color:var(--ochre);border-radius:10px;background:transparent;cursor:pointer;width:100%}
  .lab{font-family:var(--mono);font-size:10px;color:var(--ink2);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.06em}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid var(--line)}
  .btn{font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;border:1px solid var(--ink);cursor:pointer;background:var(--ink);color:var(--paper);transition:.12s}
  .btn:hover{transform:translateY(-1px)} .btn.ghost{background:transparent;color:var(--ink)} .btn:disabled{opacity:.35;cursor:not-allowed}
  .res{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:var(--paper)}
  .res .rh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .res .rv{font-family:var(--disp);font-weight:600;font-size:16px;margin-top:3px} .res .rn{font-size:12px;color:var(--ink2);margin-top:3px}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
  .tag.sed{background:#f4dcc2;color:#9a4a16} .tag.ok{background:#d8e8dd;color:var(--good)}
  table.bom{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.bom th,table.bom td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.bom th{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink2)}
  table.bom td:last-child,table.bom th:last-child{text-align:right;font-family:var(--mono)}
  .check{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .check .bx{width:15px;height:15px;border:1.5px solid var(--ink2);border-radius:4px;flex:none;margin-top:1px}
  .sechead{font-family:var(--disp);font-weight:600;font-size:18px;margin:18px 0 6px}
  .muted{color:var(--ink2)}
  #inspector{margin-top:14px}
  .insp{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -38px rgba(29,42,42,.5);padding:14px 16px}
  .insp .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .insp .ih .t{font-family:var(--disp);font-weight:600;font-size:18px;line-height:1.05}
  .insp .ih .ty{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
  .insp .x{font-family:var(--mono);font-size:11px;color:var(--ink2);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--paper)}
  .insp .sub2{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:12px 0 4px}
  .insp .drow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .insp .drow b{font-family:var(--mono);font-weight:500}
  @media print{header.top,.foot,.rail{display:none}.wrap{grid-template-columns:1fr}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">Project <em>Astral</em></span><span class="sub">build flow</span></div>
  <div class="topnote">Concept configurator · sizes to NZS 3604 where in scope · SED items flagged, not designed</div>
</header>
<div class="wrap">
  <div class="stage">
    <div class="canvas">
      <div class="bar">
        <div class="tabs" id="tabs"></div>
        <span class="sc" id="planScale"></span>
      </div>
      <svg id="view" viewBox="-14 -14 628 540" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="chips-row" id="chips"></div>
    </div>
    <div id="inspector"></div>
  </div>
  <div class="panel">
    <div class="rail" id="rail"></div>
    <div class="step-head"><div class="kx" id="kx"></div><h2 id="title"></h2><p id="blurb"></p></div>
    <div class="body" id="body"></div>
    <div class="foot">
      <div class="stat" id="footnote"></div>
    </div>
  </div>
</div>
<script>
const CLAD=[{n:"Cream",h:"#ece6d6"},{n:"Sand",h:"#d8c7a3"},{n:"Clay",h:"#b06a45"},{n:"Sage",h:"#8f9b86"},{n:"Charcoal",h:"#3c3f43"},{n:"White",h:"#f4f2ec"}];
const ROOFC=[{n:"Ironsand",h:"#33373b"},{n:"Grey Friars",h:"#50545a"},{n:"Titania",h:"#d6d2c8"},{n:"Karaka",h:"#39402f"},{n:"Sandstone",h:"#b7ab93"},{n:"Copper",h:"#9c5a32"}];
const S={
  type:"Garage",wind:"Extra High",found:"Concrete slab",
  L:10000,W:8000,studH:3000,spacing:600,
  roof:"Hip",pitch:20,cover:"Colorsteel corrugate",struct:"Prefab trusses",roofCol:"Ironsand",
  joinery:"Fiji mahogany",
  clad:"Plaster system",cladCol:"Cream",lining:"Plywood",floor:"Sealed / clear",insul:"None — open",
  view:"plan", layer:"arch", face:"front", cut:"cross", unit:"m", eave:450,
  openings:[
    {id:1,kind:"Garage",wall:"W",off:4000,width:5000},
    {id:2,kind:"Door",wall:"S",off:2000,width:810},
    {id:3,kind:"Window",wall:"S",off:7200,width:1200}
  ],
  parts:[]
};
let nid=4, step=0, sel=null, detailFor=null;
const STEPS=["Site","Footprint","Roof","Openings","Layout","Finishes","Resolve","Outputs"];
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
function el(p,t,a,x){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;p.appendChild(n);return n;}
function clr(n){while(n.firstChild)n.removeChild(n.firstChild);}
const fmt=v=>Math.round(v).toLocaleString();
const cladHex=()=>(CLAD.find(c=>c.n===S.cladCol)||CLAD[0]).h;
const roofHex=()=>(ROOFC.find(c=>c.n===S.roofCol)||ROOFC[0]).h;
const WALLEN={N:()=>S.L,S:()=>S.L,E:()=>S.W,W:()=>S.W};
const WALLNAME={S:"Front",N:"Back",W:"Left end",E:"Right end"};
const WALLREF={S:"left",N:"left",W:"top",E:"top"};
const openFrac=o=>Math.max(0,Math.min(1,o.off/WALLEN[o.wall]()));
/* §7.1 wall-type legend */
const WALLTYPES={
  External:{fill:'#1d2a2a',stroke:'#1d2a2a',hatch:null,label:'External'},
  Partition:{fill:'#cdbf9f',stroke:'#1d2a2a',hatch:null,label:'Partition'},
  Structural:{fill:'#c8975a',stroke:'#7a4a16',hatch:'diag',label:'Structural'},
  Wet:{fill:'#a8c8cf',stroke:'#2f6f7e',hatch:'dot',label:'Wet area'}
};
const WALLTYPE_KEYS=["Partition","Structural","Wet"];
function wtStyle(t){return WALLTYPES[t]||WALLTYPES.Partition;}

/* ---------- RULES ---------- */
function loadedDim(){return Math.round(S.W/2);}
function studRule(){const eh=S.wind==="Extra High"||S.wind==="Cyclonic (SED)";const sp="@"+S.spacing;
  if(S.studH>=3000)return eh?{v:"140×45 SG8 "+sp,n:"3604 T8.2 · "+S.wind+" · LD "+(loadedDim()/1000).toFixed(1)+"m · indicative"}:{v:"90×70 SG8 "+sp,n:"3604 T8.2 · "+S.wind+" · 3.0m · indicative"};
  if(S.studH>=2700)return eh?{v:"90×70 SG8 "+sp,n:"3604 T8.2 · "+S.wind+" · indicative"}:{v:"90×45 SG8 "+sp,n:"3604 T8.2 · "+S.wind+" · indicative"};
  return {v:"90×45 SG8 "+sp,n:"3604 T8.2 · "+S.wind+" · indicative"};}
/* framing/bracing helpers (indicative) */
function lintelDepthMM(span){return span>3000?240:span<=1200?90:span<=2000?140:190;}
function nogRows(){return Math.max(1,Math.round(S.studH/1350));}
function braceLayout(wall){const len=WALLEN[wall]();const ops=S.openings.filter(o=>o.wall===wall).map(o=>[o.off-o.width/2,o.off+o.width/2]);
  const clear=(a,b)=>!ops.some(([s,e])=>b>s&&a<e);const pw=900;const cand=[200,(len-pw)/2,len-pw-200];const out=[];
  cand.forEach(st=>{st=Math.max(100,Math.min(len-pw-100,st));if(clear(st,st+pw)&&!out.some(o=>Math.abs(o-st)<pw*1.2))out.push(st);});
  return out.map(st=>({start:st,len:pw}));}
function lintelRule(span){if(span>3000)return{v:"Engineered head / portal",sed:true,n:span+"mm > 3604 lintel range → SED"};
  if(span<=1200)return{v:"2/90×45 SG8",sed:false,n:span+"mm"};if(span<=2000)return{v:"2/140×45 SG8",sed:false,n:span+"mm"};return{v:"2/190×45 SG8",sed:false,n:span+"mm"};}
function roofRule(){const span=S.W;if(S.struct.indexOf("truss")>-1)return{v:"Prefab "+(S.roof==="Hip"?"hip ":"")+"trusses @900",sed:true,n:(span/1000).toFixed(1)+"m span · fabricator PS1"};
  if(span>6000)return{v:"Engineered rafters/beam",sed:true,n:(span/1000).toFixed(1)+"m → SED"};return{v:"Cut roof per 3604",sed:false,n:(span/1000).toFixed(1)+"m span"};}
function bracingRule(){let gov=null;["N","S","E","W"].forEach(w=>{const tot=S.openings.filter(o=>o.wall===w).reduce((a,o)=>a+o.width,0);if(tot>0.45*WALLEN[w]())gov=w;});
  if(gov)return{v:"Engineered portal at "+WALLNAME[gov].toLowerCase(),sed:true,n:"Opening(s) leave little wall on that line → governing"};
  const area=(S.L*S.W)/1e6;const f=({"Medium":0.7,"High":1.0,"Very High":1.3,"Extra High":1.6,"Cyclonic (SED)":2.0})[S.wind]||1.6;
  return{v:"~"+Math.round(area*55*f)+" BUs each way (indicative)",sed:false,n:"Achieved via P21 panels — confirm"};}
function tieRule(){const hi=["High","Very High","Extra High","Cyclonic (SED)"].indexOf(S.wind)>-1;
  return hi?{v:"Cyclone straps + M12 chem anchors @600",sed:S.wind==="Cyclonic (SED)",n:"Strap every truss/rafter, both ends"}:{v:"Standard 3604 fixings",sed:false,n:"Skew nails / wire dogs"};}
function footRule(){const big=S.struct.indexOf("truss")>-1||S.W>6000||S.wind==="Cyclonic (SED)";
  return{v:S.found==="Concrete slab"?"Slab + thickened edge & pads":"Engineered pile foundation",sed:true,n:big?"Loads/spans → engineer + PS1":"Confirm engineer"};}
function qtys(){const Lm=S.L/1000,Wm=S.W/1000,Hm=S.studH/1000;const perim=2*(Lm+Wm),wallA=perim*Hm,floorA=Lm*Wm;
  const roofA=S.roof==="Flat"?floorA*1.05:floorA/Math.cos(S.pitch*Math.PI/180)*1.06;
  return{perim:perim.toFixed(1),floorA:floorA.toFixed(0),wallA:wallA.toFixed(0),roofA:roofA.toFixed(0),
    concrete:(floorA*0.1+perim*0.05).toFixed(1),mesh:Math.ceil(floorA/12.5),
    studsLm:Math.round(perim/(S.spacing/1000)*Hm+perim*3),purlinsLm:Math.round(roofA/0.9),
    roofingM2:Math.round(roofA),cladM2:Math.round(wallA*0.86),liningM2:Math.round(wallA*0.86),
    joinery:S.openings.length+" openings"};}

/* ---------- MODEL LAYER (Phase 1: hierarchical object graph = single source of truth) ---------- */
let M=null;
function mk(id,type,name,parent,params,geometry){return {id,type,name,parent,children:[],params:params||{},geometry:geometry||{},material:{},derived:{},compliance:[],rules:[],links:{}};}
const CTX=()=>({wind:S.wind,exposure:S.wind,studH:S.studH,spacing:S.spacing});
/* NZS 3604 logic now lives as node-based rules. Each rule fn returns the canonical
   result object {v,sed,n}; runRules stores {value,status,basis} (+raw) on the node. */
const RULES={
  Wall:[{id:'stud',fn:(n,c)=>studRule()}],
  Opening:[{id:'lintel',fn:(n,c)=>lintelRule(n.params.width)}],
  RoofSystem:[{id:'structure',fn:(n,c)=>roofRule()}],
  Building:[{id:'bracing',fn:(n,c)=>bracingRule()},{id:'tie',fn:(n,c)=>tieRule()},{id:'foundation',fn:(n,c)=>footRule()},
            {id:'lintels',fn:(n,c)=>lintelRule(Math.max(810,...S.openings.filter(o=>o.kind!=="Garage").map(o=>o.width),0))}],
  Slab:[],Partition:[],Site:[]
};
function runRules(n,c){(RULES[n.type]||[]).forEach(r=>{const res=r.fn(n,c);n.rules.push(r.id);n.compliance.push({rule:r.id,value:res.v,status:res.sed?'sed':'ok',basis:res.n,raw:res});});}
/* derivation: compute sub-elements into node.derived (exist in model, NOT drawn yet) */
function deriveWall(n,c){const len=n.params.length;n.derived={studs:{count:Math.round(len/S.spacing)+1,size:studRule().v},topPlate:2,bottomPlate:1,bracingPanels:[]};}
function deriveOpening(n,c){n.derived={lintel:lintelRule(n.params.width),trimmingStuds:2,sill:n.params.kind==='Window'};}
function deriveRoof(n,c){const truss=S.struct.indexOf('truss')>-1;n.derived={system:truss?'Prefab trusses':'Cut rafters',members:Math.round(S.L/900),purlins:Math.round((S.L*S.W/1e6)/0.9)};}
function deriveBuilding(n,c){n.derived={bracing:bracingRule().v,tieDown:tieRule().v};}
const DERIVE={Wall:deriveWall,Opening:deriveOpening,RoofSystem:deriveRoof,Building:deriveBuilding};
function buildModelFromLegacyState(S){
  const byId={};const add=n=>{byId[n.id]=n;return n;};
  const site=add(mk('site','Site','Site',null,{wind:S.wind,found:S.found}));
  const bld=add(mk('building','Building',S.type,'site',{type:S.type,L:S.L,W:S.W,studH:S.studH,spacing:S.spacing},{footprint:{L:S.L,W:S.W}}));
  site.children.push('building');
  const slab=add(mk('slab','Slab','Slab / Foundation','building',{found:S.found},{outline:{L:S.L,W:S.W}}));bld.children.push('slab');
  ['N','S','E','W'].forEach(w=>{const wall=add(mk('wall-'+w,'Wall',WALLNAME[w],'building',{wall:w,type:'External',length:WALLEN[w](),height:S.studH,studSpec:studRule().v},{}));bld.children.push(wall.id);});
  S.parts.forEach(p=>{const pn=add(mk('part-'+p.id,'Wall','Internal '+(p.type||'Partition'),'building',{wall:'INT',type:(p.type||'Partition'),length:p.len,height:S.studH}));bld.children.push(pn.id);});
  S.openings.forEach(o=>{const op=add(mk('opening-'+o.id,'Opening',o.kind,'wall-'+o.wall,{kind:o.kind,width:o.width,off:o.off,wall:o.wall}));const pw=byId['wall-'+o.wall];if(pw)pw.children.push(op.id);});

/* ---------- PAPER-SPACE: project metadata + sheet registry (Phase 1) ---------- */
const PROJECT={firm:"PROJECT ASTRAL",tagline:"spatial construction set",
  consent:"BUILDING CONSENT",location:"Wanaka NZ",paper:"A1",status:"CONCEPT",rev:"P1"};
const COMPASS={front:"South",back:"North",left:"West",right:"East"};
const SHEET_SERIES={A0:"Register",A1:"Plans",A2:"Elevations",A3:"Sections",A4:"Schedules",A5:"Details"};
/* prefix follows Upscale Plan §8 taxonomy. byFace expands to one numbered sheet per elevation. */
const SHEETS={
  cover:           {prefix:"A0",title:"Drawing Register",   scale:"NTS"},
  plan_arch:       {prefix:"A1",title:"Floor Plan",         scale:"1:100"},
  plan_foundation: {prefix:"A1",title:"Foundation Plan",    scale:"1:100"},
  plan_framing:    {prefix:"A1",title:"Framing Plan",       scale:"1:100"},
  elevation_arch:       {prefix:"A2",title:"Elevation",         scale:"1:100",byFace:true},
  elevation_foundation: {prefix:"A2",title:"Concrete Elevation",scale:"1:100",byFace:true},
  elevation_framing:    {prefix:"A2",title:"Framing Elevation", scale:"1:50", byFace:true},
  section_cross:  {prefix:"A3",title:"Cross Section",        scale:"1:50"},
  section_long:   {prefix:"A3",title:"Longitudinal Section", scale:"1:50"},
  detail_wall:    {prefix:"A5",title:"Wall Framing Detail",  scale:"1:5"},
  detail_roof:    {prefix:"A5",title:"Eave Detail",          scale:"1:10"},
  detail_slab:    {prefix:"A5",title:"Slab Edge Detail",     scale:"1:5"},
  detail_opening: {prefix:"A5",title:"Lintel / Head Detail", scale:"1:5"}
};
const SHEET_FACES=["front","back","left","right"];
/* Deterministic, declaration-ordered numbering. Add a sheet -> it auto-numbers in its series. */
function buildSheetIndex(){const ctr={},idx={};
  Object.keys(SHEETS).forEach(key=>{const def=SHEETS[key],p=def.prefix;
    const assign=id=>{ctr[p]=(ctr[p]||0)+1;idx[id]={prefix:p,seq:ctr[p]};};
    if(def.byFace)SHEET_FACES.forEach(f=>assign(key+'@'+f));else assign(key);});
  return idx;}
const SHEET_INDEX=buildSheetIndex();

/* ---------- PAPER-SPACE: meta resolution (Phase 2) ---------- */
function currentSheetRef(){
  if(S.view==='plan')return {key:S.layer==='framing'?'plan_framing':S.layer==='foundation'?'plan_foundation':'plan_arch'};
  if(S.view==='elevation')return {key:S.layer==='framing'?'elevation_framing':S.layer==='foundation'?'elevation_foundation':'elevation_arch',face:S.face};
  if(S.view==='section')return {key:S.cut==='long'?'section_long':'section_cross'};
  const ty=(M&&detailFor&&M.byId[detailFor])?M.byId[detailFor].type:'';
  if(!ty)return {key:'detail_wall',generic:true};
  return {key:ty==='RoofSystem'?'detail_roof':ty==='Slab'?'detail_slab':ty==='Opening'?'detail_opening':'detail_wall'};
}
function getSheetMeta(){
  const ref=currentSheetRef(),def=SHEETS[ref.key]||SHEETS.plan_arch;
  const refId=def.byFace?ref.key+'@'+(ref.face||'front'):ref.key;
  const ix=SHEET_INDEX[refId]||{prefix:def.prefix,seq:1};
  const number=ix.prefix+'.'+String(ix.seq).padStart(2,'0');
  let title=def.title,sub='';
  if(def.byFace){const c=COMPASS[ref.face]||'South';title=def.title==='Elevation'?c+' Elevation':c+' '+def.title;sub=c;}
  else if(ref.generic){title='Construction Detail';}
  else if(ref.key.indexOf('detail_')===0){sub=def.title.replace(/ Detail$/,'');}
  const scale=def.scale;
  return {key:ref.key,refId,number,prefix:ix.prefix,
    title:title.toUpperCase(),titleMixed:title,sub:sub.toUpperCase(),
    series:(SHEET_SERIES[ix.prefix]||'').toUpperCase(),
    scale,scaleNote:scale+' @ '+PROJECT.paper,
    project:(S.type||'Building'),location:PROJECT.location,wind:S.wind,
    dims:(S.L/1000).toFixed(1)+' × '+(S.W/1000).toFixed(1)+' m',
    date:new Date().toLocaleDateString('en-NZ'),status:PROJECT.status,rev:PROJECT.rev};
}
function getSheetNumber(){return getSheetMeta().number;}
function getSheetTitle(){return getSheetMeta().titleMixed;}

function dimPlan(s,sc,w,h,x0,y0){
  const ink='#1d2a2a',lab='#9a8f78';
  const fmtMM=mm=>S.unit==='m'?(mm/1000).toFixed(2):Math.round(mm)+'';
  const T=(x,y,t,sz,col,anc,rot)=>{const e=el(s,'text',{x,y,fill:col||ink,'font-size':sz||7.5,'font-family':'IBM Plex Mono','text-anchor':anc||'middle'},t);if(rot)e.setAttribute('transform','rotate('+rot+' '+x+' '+y+')');return e;};
  const dedup=arr=>[...new Set(arr.map(n=>Math.round(n)))].sort((a,b)=>a-b);
  const rowH=(ptsMM,y,name)=>{if(ptsMM.length<2)return;const xs=ptsMM.map(mm=>x0+mm*sc);
    el(s,'line',{x1:xs[0],y1:y,x2:xs[xs.length-1],y2:y,stroke:ink,'stroke-width':0.5});
    xs.forEach(x=>el(s,'line',{x1:x,y1:y-3,x2:x,y2:y+3,stroke:ink,'stroke-width':0.5}));
    for(let i=1;i<xs.length;i++){const seg=ptsMM[i]-ptsMM[i-1];if((xs[i]-xs[i-1])>14)T((xs[i-1]+xs[i])/2,y-3,fmtMM(seg),7.5);}
    T(xs[xs.length-1]+6,y+2.5,name,6.5,lab,'start');};
  const rowV=(ptsMM,x,name)=>{if(ptsMM.length<2)return;const ys=ptsMM.map(mm=>y0+mm*sc);
    el(s,'line',{x1:x,y1:ys[0],x2:x,y2:ys[ys.length-1],stroke:ink,'stroke-width':0.5});
    ys.forEach(y=>el(s,'line',{x1:x-3,y1:y,x2:x+3,y2:y,stroke:ink,'stroke-width':0.5}));
    for(let i=1;i<ys.length;i++){const seg=ptsMM[i]-ptsMM[i-1];if((ys[i]-ys[i-1])>14)T(x-3,(ys[i-1]+ys[i])/2,fmtMM(seg),7.5,null,'middle',-90);}
    T(x,ys[ys.length-1]+10,name,6.5,lab,'middle');};
  const opsAt=wll=>S.openings.filter(o=>o.wall===wll).map(o=>o.off).sort((a,b)=>a-b);
  const partsAcrossX=S.parts.filter(p=>p.dir==="Across width").map(p=>p.off).sort((a,b)=>a-b);
  const partsAlongY=S.parts.filter(p=>p.dir==="Along length").map(p=>p.off).sort((a,b)=>a-b);
  const nOps=opsAt('N'),sOps=opsAt('S'),wOps=opsAt('W'),eOps=opsAt('E');
  // TOP
  if(nOps.length)rowH(dedup([0,...nOps,S.L]),y0-22,'WINDOWS');
  rowH([0,S.L],y0-(nOps.length?40:22),'OVERALL');
  // BOTTOM
  let bRow=y0+h+22;
  if(sOps.length){rowH(dedup([0,...sOps,S.L]),bRow,'WINDOWS');bRow+=18;}
  if(partsAcrossX.length){rowH(dedup([0,...partsAcrossX,S.L]),bRow,'INTERIOR WALLS');bRow+=18;}
  rowH([0,S.L],bRow,'OVERALL');
  // LEFT
  let lCol=x0-22;
  if(wOps.length){rowV(dedup([0,...wOps,S.W]),lCol,'WINDOWS');lCol-=18;}
  if(partsAlongY.length){rowV(dedup([0,...partsAlongY,S.W]),lCol,'INTERIOR WALLS');lCol-=18;}
  rowV([0,S.W],lCol,'OVERALL');
  // RIGHT
  let rCol=x0+w+22;
  if(eOps.length){rowV(dedup([0,...eOps,S.W]),rCol,'WINDOWS');rCol+=18;}
  rowV([0,S.W],rCol,'OVERALL');

    el(svg,'text',{x:bx,y:by-2,fill:'#3c4a47','font-size':7.5,'font-family':'IBM Plex Mono','letter-spacing':'0.1em'},'DETAIL KEY');
    items.forEach((it,i)=>{const yy=by+9+i*rh;

    });

}
function drawSectionMarkers(svg){
  // §7.3 plan section markers — A-A cross (vertical line across W), B-B long (horizontal line across L)
  if(S.view!=='plan')return;
  const g=planGeom();const {w,h,x0,y0}=g;
  const mk=(x1,y1,x2,y2,tag,cut,dir)=>{
    el(svg,'line',{x1,y1,x2,y2,stroke:'#1d2a2a','stroke-width':0.7,'stroke-dasharray':'10 3 2 3'});
    const grp=(bx,by,d)=>{const gg=el(svg,'g',{'data-section-cut':cut,style:'cursor:pointer'});MARK.section(gg,bx,by,d,tag);return gg;};
    grp(x1,y1,dir==='h'?'left':'left');grp(x2,y2,dir==='h'?'right':'right');
  };
  // A-A cross — vertical at L/2
  const ax=x0+w/2;
  mk(ax,y0-44,ax,y0+h+44,'A','cross','v');
  // B-B long — horizontal at W/2 (offset further to clear lintel callout on side walls)
  const by=y0+h/2;
  mk(x0-46,by,x0+w+46,by,'B','long','h');
}
function drawAnnotations(svg,meta){
  if(S.view==='plan')MARK.northPoint(svg,566,56);
  drawSectionMarkers(svg);
  drawCallouts(svg);
}

/* ---------- §7.4 SECTION VIEW ---------- */
function drawSection(s){
  const VW=600,VH=440,m=70;
  const cut=S.cut==='long'?'long':'cross';
  // cross section cuts ACROSS width (W), longitudinal cuts ACROSS length (L)
  const widmm = cut==='cross'? S.W : S.L;
  const apexmm = cut==='cross'
      ? (S.W/2)*Math.tan(S.pitch*Math.PI/180)
      : (S.roof==='Mono' ? S.L*Math.tan(S.pitch*Math.PI/180) : (S.W/2)*Math.tan(S.pitch*Math.PI/180));
  const slabT=100, footing=200; // mm
  const totH=S.studH+(S.roof==='Flat'?200:apexmm)+slabT+footing;
  const sc=Math.min((VW-2*m)/widmm,(VH-2*m)/totH);
  const w=widmm*sc, eh=S.studH*sc, x0=(VW-w)/2, base=VH-m-footing*sc;
  const eave=base-eh, apexP=apexmm*sc;
  const tag=cut==='cross'?'A':'B';
  $("planScale").textContent="section "+tag+"–"+tag+" · "+(cut==='cross'?"cross (across width)":"longitudinal (along length)")+" · indicative";

  // ground / ffl / slab + thickened edge
  el(s,'line',{x1:x0-40,y1:base,x2:x0+w+40,y2:base,stroke:'#1d2a2a','stroke-width':1.4});
  el(s,'rect',{x:x0,y:base,width:w,height:slabT*sc,fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1.1,'data-node-id':'slab','data-node-type':'Slab'});
  // thickened edges (foundation pads at each side)
  [[x0,1],[x0+w,-1]].forEach(([xe,d])=>{
    el(s,'rect',{x:xe-(d>0?0:14),y:base,width:14,height:(slabT+footing)*sc,fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1.1});
  });
  el(s,'text',{x:x0+w+44,y:base+3,fill:'#3c4a47','font-size':9,'font-family':'IBM Plex Mono'},'FFL 0');
  // earth hatch below ground
  for(let xx=x0-30;xx<x0+w+30;xx+=8){el(s,'line',{x1:xx,y1:base+(slabT+footing)*sc,x2:xx+5,y2:base+(slabT+footing)*sc+5,stroke:'#7a6f57','stroke-width':0.4});}

  // outline wall envelope (cut walls — heavy poché)
  const wallT=Math.max(3,90*sc);
  // left wall
  el(s,'rect',{x:x0,y:eave,width:wallT,height:eh,fill:'#1d2a2a','fill-opacity':0.82,'data-node-id':'wall-'+(cut==='cross'?'W':'S'),'data-node-type':'Wall'});
  // right wall
  el(s,'rect',{x:x0+w-wallT,y:eave,width:wallT,height:eh,fill:'#1d2a2a','fill-opacity':0.82,'data-node-id':'wall-'+(cut==='cross'?'E':'N'),'data-node-type':'Wall'});
  // top plate line
  el(s,'line',{x1:x0,y1:eave,x2:x0+w,y2:eave,stroke:'#8a7c5e','stroke-width':1.1});
  el(s,'line',{x1:x0,y1:eave+4,x2:x0+w,y2:eave+4,stroke:'#8a7c5e','stroke-width':0.7});

  // ROOF — pitched profile in section
  let rpts;
  if(S.roof==='Flat'){rpts=[[x0-((S.eave||450)*sc),eave-6],[x0+w+((S.eave||450)*sc),eave-6],[x0+w+((S.eave||450)*sc),eave-2],[x0-((S.eave||450)*sc),eave-2]];}
  else if(S.roof==='Mono'){
    const r=widmm*Math.tan(S.pitch*Math.PI/180)*sc;
    rpts=[[x0-((S.eave||450)*sc),eave-(cut==='cross'?Math.min(r,apexP*2):0)],
          [x0+w+((S.eave||450)*sc),eave],
          [x0+w+((S.eave||450)*sc),eave+4],
          [x0-((S.eave||450)*sc),eave+4]];
  } else {
    // Gable / Hip — apex at midpoint for cross; longitudinal of gable shows ridge as horizontal line
    if(cut==='long' && (S.roof==='Gable' || S.roof==='Hip')){
      rpts=[[x0-((S.eave||450)*sc),eave-apexP*0.05],[x0+w+((S.eave||450)*sc),eave-apexP*0.05],
            [x0+w+((S.eave||450)*sc),eave],[x0-((S.eave||450)*sc),eave]];
      // draw ridge line
      el(s,'line',{x1:x0-((S.eave||450)*sc),y1:eave-apexP,x2:x0+w+((S.eave||450)*sc),y2:eave-apexP,stroke:'#1d2a2a','stroke-width':0.9,'stroke-dasharray':'6 3'});
    } else {
      rpts=[[x0-((S.eave||450)*sc),eave],[x0+w/2,eave-apexP],[x0+w+((S.eave||450)*sc),eave]];
    }
  }
  el(s,'polyline',{points:rpts.map(p=>p.join(',')).join(' '),fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1.2,'data-node-id':'roof','data-node-type':'RoofSystem'});

  // truss / rafter representation
  if(S.roof!=='Flat'){
    if(cut==='cross' && S.roof!=='Mono'){
      // king + bottom chord
      el(s,'line',{x1:x0,y1:eave,x2:x0+w,y2:eave,stroke:'#8a7c5e','stroke-width':0.8,'stroke-dasharray':'8 4'});
      el(s,'line',{x1:x0+w/2,y1:eave,x2:x0+w/2,y2:eave-apexP,stroke:'#8a7c5e','stroke-width':0.6});
      el(s,'line',{x1:x0,y1:eave,x2:x0+w/2,y2:eave-apexP,stroke:'#8a7c5e','stroke-width':0.4});
      el(s,'line',{x1:x0+w,y1:eave,x2:x0+w/2,y2:eave-apexP,stroke:'#8a7c5e','stroke-width':0.4});
    } else if(cut==='long'){
      // trusses repeating @900
      const tspx=900*sc;for(let x=x0+tspx;x<x0+w;x+=tspx)el(s,'line',{x1:x,y1:eave,x2:x,y2:eave-apexP*0.18,stroke:'#c8975a','stroke-width':0.5});
    }
  }

  // openings projected onto the cut line — only those whose wall is PARALLEL to the cut show as voids in the elevation behind
  // For cross cut: walls N & S are seen as elevation behind; for long cut: walls W & E are seen behind
  const seenWalls = cut==='cross' ? ['N','S'] : ['W','E'];
  S.openings.forEach(o=>{
    if(seenWalls.indexOf(o.wall)<0) return;
    const fr=openFrac(o);
    const owid=Math.min(o.width,widmm*0.92)*sc;
    const cxp=x0+Math.max(owid/2+wallT,Math.min(w-owid/2-wallT,fr*w));
    const oh=(o.kind==='Window'?1000:(o.kind==='Garage'?Math.min(S.studH-200,2400):1980))*sc;
    const sill=(o.kind==='Window'?1000:0)*sc;
    const col=o.kind==='Garage'?'#bf6b2c':o.kind==='Door'?'#3f7d54':'#2f6f7e';
    el(s,'rect',{x:cxp-owid/2,y:base-sill-oh,width:owid,height:oh,fill:'#fbf9f3',stroke:col,'stroke-width':1.2,'stroke-dasharray':'5 3','data-node-id':'opening-'+o.id,'data-node-type':'Opening'});
  });

  // dimension annotations — stud height + apex
  const dx=x0+w+24;
  el(s,'line',{x1:dx,y1:base,x2:dx,y2:eave,stroke:'#7a6f57','stroke-width':0.5});
  el(s,'line',{x1:dx-3,y1:base,x2:dx+3,y2:base,stroke:'#7a6f57','stroke-width':0.5});
  el(s,'line',{x1:dx-3,y1:eave,x2:dx+3,y2:eave,stroke:'#7a6f57','stroke-width':0.5});
  el(s,'text',{x:dx+5,y:(base+eave)/2,fill:'#3c4a47','font-size':9,'font-family':'IBM Plex Mono'},S.studH+' stud');
  if(S.roof!=='Flat'){
    el(s,'line',{x1:dx,y1:eave,x2:dx,y2:eave-apexP,stroke:'#7a6f57','stroke-width':0.5});
    el(s,'line',{x1:dx-3,y1:eave-apexP,x2:dx+3,y2:eave-apexP,stroke:'#7a6f57','stroke-width':0.5});
    el(s,'text',{x:dx+5,y:(eave+eave-apexP)/2,fill:'#3c4a47','font-size':9,'font-family':'IBM Plex Mono'},Math.round(apexmm)+' rise');
  }

  // title strip under drawing
  el(s,'text',{x:x0+w/2,y:base+(footing*sc)+22,fill:'#3c4a47','font-size':11,'font-family':'IBM Plex Mono','text-anchor':'middle'},'SECTION '+tag+'–'+tag+' · '+(cut==='cross'?'across width':'along length')+' · '+S.roof+' '+S.pitch+'°');
}


function drawElev(s,face,layer){
  const VW=600,VH=440,m=70;
  const longFace=(face==="front"||face==="back");
  const widmm=longFace?S.L:S.W;
  const wall=face==="front"?"S":face==="back"?"N":face==="left"?"W":"E";
  const apexmm=(S.W/2)*Math.tan(S.pitch*Math.PI/180);
  const totH=S.studH+(S.roof==="Flat"?200:apexmm);
  const sc=Math.min((VW-2*m)/widmm,(VH-2*m)/totH);
  const w=widmm*sc, eh=S.studH*sc, x0=(VW-w)/2, base=VH-m, eave=base-eh, apexP=apexmm*sc;
  const fName={front:"FRONT",back:"BACK",left:"LEFT",right:"RIGHT"}[face];
  const lName=layer==="framing"?"framing":layer==="foundation"?"concrete":"envelope";
  $("planScale").textContent=fName.toLowerCase()+" elevation · "+lName+" · indicative";
  el(s,'line',{x1:x0-34,y1:base,x2:x0+w+34,y2:base,stroke:'#3c4a47','stroke-width':2});
  let pts;
  if(S.roof==="Flat"){pts=[[x0-6,eave-4],[x0+w+6,eave-2],[x0+w+6,eave+2],[x0-6,eave+2]];}
  else if(S.roof==="Mono"){const r=widmm*Math.tan(S.pitch*Math.PI/180)*sc;pts=!longFace?[[x0,eave-Math.min(r,apexP*2)],[x0+w,eave],[x0+w,eave+2],[x0,eave+2]]:[[x0,eave-apexP],[x0+w,eave-apexP],[x0+w,eave],[x0,eave]];}
  else if(!longFace){pts=[[x0,eave],[x0+w/2,eave-apexP],[x0+w,eave]];}
  else{let ridge=S.roof==="Hip"?(S.W/2)*sc:(S.roof==="Gable"?4:(S.W/2)*sc);pts=[[x0,eave],[x0+ridge,eave-apexP],[x0+w-ridge,eave-apexP],[x0+w,eave]];}
  const colKind={Garage:'#bf6b2c',Door:'#3f7d54',Window:'#2f6f7e'};
  const ows=o=>{const owid=Math.min(o.width,widmm*0.95)*sc;const cxp=x0+Math.max(owid/2,Math.min(w-owid/2,openFrac(o)*w));const oh=(o.kind==="Window"?1000:(o.kind==="Garage"?Math.min(S.studH-200,2400):1980))*sc;const sill=(o.kind==="Window"?1000:0)*sc;return{owid,cxp,oh,sill};};
  if(layer==="foundation"){
    el(s,'rect',{x:x0,y:eave,width:w,height:eh,fill:'none',stroke:'#cfc6b4','stroke-width':1,'stroke-dasharray':'4 3'});
    el(s,'line',{x1:x0-22,y1:base,x2:x0+w+22,y2:base,stroke:'#1d2a2a','stroke-width':1.4});
    el(s,'text',{x:x0+w+26,y:base+3,fill:'#3c4a47','font-size':9,'font-family':'IBM Plex Mono'},"FFL 0");
    el(s,'rect',{x:x0,y:base,width:w,height:11,fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1.1,'data-node-id':'slab','data-node-type':'Slab'});
    el(s,'rect',{x:x0-2,y:base+11,width:15,height:15,fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1});
    el(s,'rect',{x:x0+w-13,y:base+11,width:15,height:15,fill:'#efeadd',stroke:'#1d2a2a','stroke-width':1});
    el(s,'text',{x:x0+w/2,y:base+22,fill:'#7a6f57','font-size':9,'font-family':'IBM Plex Mono','text-anchor':'middle'},"100 slab · thickened edge (SED)");
  } else if(layer==="framing"){
    el(s,'rect',{x:x0,y:eave,width:w,height:eh,fill:'none',stroke:'#1d2a2a','stroke-width':1,'data-node-id':'building','data-node-type':'Building'});
    el(s,'line',{x1:x0,y1:eave+2,x2:x0+w,y2:eave+2,stroke:'#8a7c5e','stroke-width':1.1});
    el(s,'line',{x1:x0,y1:eave+5,x2:x0+w,y2:eave+5,stroke:'#8a7c5e','stroke-width':1.1});
    el(s,'line',{x1:x0,y1:base-3,x2:x0+w,y2:base-3,stroke:'#8a7c5e','stroke-width':1.4});
    const zones=S.openings.filter(o=>o.wall===wall).map(o=>{const a=ows(o);return{x1:a.cxp-a.owid/2,x2:a.cxp+a.owid/2,head:base-a.sill-a.oh,sillY:base-a.sill,kind:o.kind,owid:a.owid,cxp:a.cxp,id:o.id};});
    const inZone=x=>zones.find(z=>x>z.x1-2&&x<z.x2+2);
    const spx=S.spacing*sc;
    for(let x=x0+spx;x<x0+w-1;x+=spx){const z=inZone(x);
      if(!z)el(s,'line',{x1:x,y1:eave+5,x2:x,y2:base-3,stroke:'#8a7c5e','stroke-width':0.7});
      else{el(s,'line',{x1:x,y1:eave+5,x2:x,y2:z.head,stroke:'#8a7c5e','stroke-width':0.45});if(z.kind==='Window')el(s,'line',{x1:x,y1:z.sillY,x2:x,y2:base-3,stroke:'#8a7c5e','stroke-width':0.45});}}
    const rows=nogRows();for(let r=1;r<=rows;r++){const ny=eave+5+((base-3)-(eave+5))*(r/(rows+1));el(s,'line',{x1:x0,y1:ny,x2:x0+w,y2:ny,stroke:'#a89a78','stroke-width':0.5,'stroke-dasharray':'10 4'});}
    [x0,x0+w].forEach(cv=>{const d=cv===x0?1:-1;el(s,'line',{x1:cv+2*d,y1:eave+5,x2:cv+2*d,y2:base-3,stroke:'#1d2a2a','stroke-width':1});el(s,'line',{x1:cv+5*d,y1:eave+5,x2:cv+5*d,y2:base-3,stroke:'#8a7c5e','stroke-width':0.8});});
    zones.forEach(z=>{const ld=Math.max(4,lintelDepthMM(Math.round(z.owid/sc))*sc);

  const ih=document.createElement('div');ih.className='ih';
  ih.innerHTML=`<div><div class="ty">${n.type}</div><div class="t">${n.name||n.type}</div></div>`;
  const x=document.createElement('div');x.className='x';x.textContent='✕ deselect';x.onclick=()=>{sel=null;render();};
  ih.appendChild(x);card.appendChild(ih);
  if(['Wall','Building','RoofSystem','Slab','Opening'].includes(n.type)){const db=document.createElement('button');db.className='btn';db.style.cssText='font-size:12px;padding:8px 14px;margin-bottom:6px';db.textContent='⊕ Construction detail';db.onclick=()=>{detailFor=sel;S.view='detail';render();};card.appendChild(db);}
  const body=document.createElement('div');
  const dimF=(label,g,s,mn,mx)=>body.appendChild(dimInput(label,g,s,mn,mx,false));
  const optF=(label,vals,cur,cb)=>body.appendChild(optRow(label,vals,cur,cb));
  if(n.type==='Building'){dimF('Length',()=>S.L,v=>S.L=v,2000,20000);dimF('Width',()=>S.W,v=>S.W=v,2000,12000);dimF('Stud height',()=>S.studH,v=>S.studH=v,2400,3600);optF('Stud spacing',[400,600],S.spacing,v=>S.spacing=+v);}
  else if(n.type==='Slab'){optF('Foundation',["Concrete slab","Timber piles"],S.found,v=>S.found=v);}
  else if(n.type==='RoofSystem'){optF('Form',["Gable","Hip","Mono","Flat"],S.roof,v=>S.roof=v);optF('Covering',["Colorsteel corrugate","Colorsteel tray","Membrane","Tile"],S.cover,v=>S.cover=v);optF('Structure',["Prefab trusses","Cut roof"],S.struct,v=>S.struct=v);}
  else if(n.type==='Opening'){const o=S.openings.find(z=>'opening-'+z.id===sel);if(o){optF('Type',["Garage","Door","Window"],o.kind,v=>o.kind=v);optF('Wall',["S","N","W","E"].map(w=>WALLNAME[w]),WALLNAME[o.wall],v=>o.wall=Object.keys(WALLNAME).find(k=>WALLNAME[k]===v));dimF('Width',()=>o.width,v=>o.width=v,400,7000);dimF('Set-out to centre',()=>o.off,v=>o.off=v,0,20000);}}
  else if(n.type==='Partition'){const p=S.parts.find(z=>'part-'+z.id===sel);if(p){const runMax=p.dir==="Across width"?S.W:S.L,posMax=p.dir==="Across width"?S.L:S.W;optF('Direction',["Across width","Along length"],p.dir,v=>{p.dir=v;p.start=0;p.len=(v==="Across width"?S.W:S.L);});dimF('Position offset',()=>p.off,v=>p.off=v,0,posMax);dimF('Start',()=>p.start||0,v=>p.start=v,0,runMax);dimF('Length',()=>(p.len!=null?p.len:runMax),v=>p.len=v,200,runMax);}}
  else if(n.type==='Wall'){const info=document.createElement('p');info.className='muted';info.style.fontSize='12px';info.textContent='Walls derive from the building — edit size via the Building.';body.appendChild(info);}
  card.appendChild(body);
  if(n.derived&&Object.keys(n.derived).length){const sh=document.createElement('div');sh.className='sub2';sh.textContent='Derived sub-elements';card.appendChild(sh);
    Object.entries(n.derived).forEach(([k,v])=>{const r=document.createElement('div');r.className='drow';r.innerHTML=`<span>${k}</span><b>${typeof v==='object'?JSON.stringify(v).replace(/[{}"]/g,'').replace(/,/g,', '):v}</b>`;card.appendChild(r);});}
  if(n.compliance&&n.compliance.length){const sh=document.createElement('div');sh.className='sub2';sh.textContent='Compliance';card.appendChild(sh);
    n.compliance.forEach(c=>{const r=document.createElement('div');r.className='drow';r.innerHTML=`<span>${c.rule} — ${c.value}<br><span class="muted" style="font-size:11px">${c.basis}</span></span><span class="tag ${c.status==='sed'?'sed':'ok'}">${c.status}</span>`;card.appendChild(r);});}
  host.appendChild(card);
}
function pillRow(items,cur,onpick,cls){const wrap=document.createElement('div');wrap.className='pillrow';items.forEach(([k,lbl])=>{const d=document.createElement('div');d.className='tab'+(cls?' sm':'')+(cur===k?' on':'');d.textContent=lbl;d.onclick=()=>onpick(k);wrap.appendChild(d);});return wrap;}
function renderTabs(){const t=$("tabs");t.innerHTML="";
  const vrow=document.createElement('div');vrow.className='ctrlrow';
  vrow.appendChild(pillRow([["plan","Plan"],["elevation","Elevation"],["section","Section"],["detail","Detail"]],S.view,k=>{S.view=k;renderTabs();drawCanvas();}));
  const u=document.createElement('div');u.className='tab unit';u.textContent=S.unit;u.title='switch units';u.onclick=()=>{S.unit=S.unit==='m'?'mm':'m';render();};vrow.appendChild(u);
  t.appendChild(vrow);
  const lr=document.createElement('div');lr.className='ctrlrow';const ll=document.createElement('span');ll.className='ctrllab';ll.textContent='layer';lr.appendChild(ll);
  lr.appendChild(pillRow([["arch","Architectural"],["framing","Framing"],["foundation","Concrete"]],S.layer,k=>{S.layer=k;renderTabs();drawCanvas();},true));
  t.appendChild(lr);
  if(S.view==="elevation"){const fr=document.createElement('div');fr.className='ctrlrow';const fl=document.createElement('span');fl.className='ctrllab';fl.textContent='face';fr.appendChild(fl);
    fr.appendChild(pillRow([["front","Front"],["back","Back"],["left","Left"],["right","Right"]],S.face,k=>{S.face=k;renderTabs();drawCanvas();},true));
    t.appendChild(fr);}
  if(S.view==="section"){const fr=document.createElement('div');fr.className='ctrlrow';const fl=document.createElement('span');fl.className='ctrllab';fl.textContent='cut';fr.appendChild(fl);
    fr.appendChild(pillRow([["cross","A–A cross"],["long","B–B long"]],S.cut,k=>{S.cut=k;renderTabs();drawCanvas();},true));
    t.appendChild(fr);}
}
function render(){rebuildModel();const r=$("rail");r.innerHTML="";
  STEPS.forEach((nm,i)=>{if(i===6){const g=document.createElement('div');g.className='sctgap';r.appendChild(g);}const d=document.createElement('div');d.className='sct'+(i===step?' on':'');d.textContent=(i+1)+' '+nm;d.onclick=()=>{step=i;render();};r.appendChild(d);});
  $("kx").textContent="Step "+(step+1)+" / "+STEPS.length+" · "+STEPS[step];
  const titles=["Site & exposure","Footprint","Roof","Openings & joinery","Internal layout","Cladding & finishes","Auto-resolve to the rules","Your build"];
  const blurbs=["Where it sits and what it's exposed to.","Set size and stud height.","Put a roof on it — try the colours, then flick to Elevation.","Type a set-out measurement to place each door and window.","Drop in internal walls to make rooms — placed by measurement.","Skin it — see the cladding and roof colours on the elevations.","Studs, lintels, bracing and tie-downs, worked out.","Spec, materials and the checklist to make it real."];
  $("title").textContent=titles[step];$("blurb").textContent=blurbs[step];
  renderBody();renderTabs();drawCanvas();renderInspector();
  $("footnote").textContent=step===6?"↑ computed, not asked":"";}
rebuildModel();
render();
/* Phase 2: click any tagged element -> select it (highlight + inspector) */
$("view").addEventListener('click',function(e){
  // section marker click → open section view at that cut
  let sm=e.target;while(sm&&sm!==this&&!(sm.getAttribute&&sm.getAttribute('data-section-cut')))sm=sm.parentNode;
  if(sm&&sm.getAttribute&&sm.getAttribute('data-section-cut')){
    S.cut=sm.getAttribute('data-section-cut');S.view='section';render();return;
  }
  // callout bubble click → open matching detail
  let c=e.target;while(c&&c!==this&&!(c.getAttribute&&c.getAttribute('data-callout-key')))c=c.parentNode;
  if(c&&c.getAttribute&&c.getAttribute('data-callout-key')){
    const nodeId=c.getAttribute('data-callout-node');
    if(nodeId&&M&&M.byId[nodeId]){detailFor=nodeId;sel=nodeId;}
    S.view='detail';render();return;
  }
  // standard select-on-click
  let n=e.target;while(n&&n!==this&&!(n.getAttribute&&n.getAttribute('data-node-id')))n=n.parentNode;
  if(n&&n.getAttribute&&n.getAttribute('data-node-id')){sel=n.getAttribute('data-node-id');render();}
});
</script>
